<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人导航页面 - 链接索引">
    <title>我的个人导航</title>

    <!-- Font Awesome 6 图标库 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==================== CSS 变量：修改配色从这里入手 ==================== */
        :root {
            --bg-gradient-start: #f0f2f5;
            --bg-gradient-end: #e8ecf1;
            --card-bg: #ffffff;
            --card-bg-hover: #fafbfc;
            --accent: #5b6af0;
            --accent-light: #eef0ff;
            --accent-hover: #4a56d4;
            --text-primary: #1a1a2e;
            --text-secondary: #5a6070;
            --text-muted: #9499a5;
            --card-border: #e8eaef;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
            --card-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            --spacing-xs: 6px;
            --spacing-sm: 12px;
            --spacing-md: 20px;
            --spacing-lg: 28px;
            --spacing-xl: 40px;
            --transition-fast: 0.18s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial,
                sans-serif;
            background: linear-gradient(170deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            /* 改为 flex 居中，全屏高度 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景光斑 */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: floatBlob 20s ease-in-out infinite;
        }
        body::before {
            width: 420px;
            height: 420px;
            background: #d5d9ff;
            top: -120px;
            left: -100px;
        }
        body::after {
            width: 350px;
            height: 350px;
            background: #e0e7ff;
            bottom: -100px;
            right: -80px;
            animation-delay: -10s;
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -30px) scale(1.06); }
            50% { transform: translate(-20px, 20px) scale(0.94); }
            75% { transform: translate(-35px, -15px) scale(1.04); }
        }

        /* ==================== 主容器：16:9 比例 ==================== */
        .main-container {
            position: relative;
            z-index: 1;
            /* 关键：宽高比 16:9，最大宽度限制，内容超出可滚动 */
            aspect-ratio: 16 / 9;
            width: 100%;
            max-width: 960px;          /* 16:9 下宽度960，高度540 */
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            /* 内部滚动，防止内容溢出破坏比例 */
            overflow-y: auto;
            overflow-x: hidden;
            /* 内边距稍微压缩，避免内容过于拥挤 */
            padding: 28px 32px;
            animation: fadeInUp 0.7s ease both;
            /* 自定义滚动条 */
            scrollbar-width: thin;
            scrollbar-color: #cbd5e0 #f1f5f9;
        }
        .main-container::-webkit-scrollbar {
            width: 6px;
        }
        .main-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .main-container::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 8px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== 个人信息区 ==================== */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar-wrapper {
            position: relative;
            width: 80px;          /* 略微缩小以适应比例 */
            height: 80px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .avatar-wrapper::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent), #a78bfa, #f0abfc, var(--accent));
            mask: radial-gradient(farthest-side, transparent 62%, #000 64%);
            -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 64%);
            animation: avatarGlow 4s linear infinite;
            pointer-events: none;
        }
        @keyframes avatarGlow { to { transform: rotate(360deg); } }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            background: #e8eaef;
        }
        .avatar-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 30px;
            font-weight: 700;
            position: relative;
            z-index: 1;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: 0.01em;
        }
        .profile-bio {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            max-width: 360px;
            line-height: 1.5;
        }
        .tags-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tag {
            padding: 3px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--accent);
            background: var(--accent-light);
            border-radius: var(--radius-full);
            transition: background var(--transition-fast), color var(--transition-fast);
        }
        .tag:hover { background: var(--accent); color: #fff; }

        .social-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f5f6f9;
            color: var(--text-secondary);
            font-size: 1rem;
            text-decoration: none;
            transition: all var(--transition-smooth);
        }
        .social-link:hover {
            background: var(--accent);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(91, 106, 240, 0.3);
        }

        /* ==================== 链接分类区 ==================== */
        .links-sections {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .category-title {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .link-cards {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .link-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text-primary);
            transition: all var(--transition-smooth);
            box-shadow: var(--card-shadow);
        }
        .link-card:hover {
            background: var(--card-bg-hover);
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-1px);
            border-color: #d5d8e8;
        }
        .link-card-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .link-card:hover .link-card-icon { transform: scale(1.05); }

        .icon-social { background: #eef2ff; color: #5b6af0; }
        .icon-project { background: #fdf2f8; color: #db2777; }
        .icon-tool { background: #ecfdf5; color: #059669; }
        .icon-other { background: #fff7ed; color: #ea580c; }

        .link-card-text { flex: 1; min-width: 0; }
        .link-card-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
        }
        .link-card-desc {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-card-arrow {
            color: #c5c9d4;
            font-size: 0.7rem;
            flex-shrink: 0;
            transition: all var(--transition-smooth);
        }
        .link-card:hover .link-card-arrow {
            color: var(--accent);
            transform: translateX(2px);
        }

        /* ==================== 页脚 ==================== */
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.7rem;
            letter-spacing: 0.03em;
        }
        .footer .heart {
            color: #ef4444;
            display: inline-block;
            animation: heartbeat 1.4s ease infinite;
        }
        @keyframes heartbeat {
            0%, 100%, 50% { transform: scale(1); }
            25% { transform: scale(1.2); }
            75% { transform: scale(0.95); }
        }

        /* ==================== 响应式：小屏幕调整为自适应比例 ==================== */
        @media (max-width: 768px) {
            .main-container {
                /* 在手机上取消固定比例，改为自动高度，宽度撑满 */
                aspect-ratio: auto;
                max-width: 100%;
                height: auto;
                padding: 20px 16px;
                border-radius: var(--radius-md);
            }
            body {
                padding: 12px;
                align-items: flex-start;  /* 靠上对齐，方便滚动 */
            }
            .avatar-wrapper {
                width: 64px;
                height: 64px;
            }
            .profile-name { font-size: 1.2rem; }
            .profile-bio { font-size: 0.8rem; }
        }

        @media (max-width: 380px) {
            .link-card-desc { display: none; }
        }
    </style>
</head>
<body>
    <main class="main-container">

        <!-- 个人信息区（请修改为你的信息） -->

            <section class="link-category">

            <section class="link-category">

                        <span class="link-card-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
                    </a>

                        <span class="link-card-text"><span class="link-card-title">工具名称二</span><span class="link-card-desc">收藏的实用在线资源</span></span>

        </div>

        <footer class="footer">
            <p>用 <span class="heart">♥</span> 打造 · 持续更新中</p>
            <p style="margin-top:2px;">&copy; 2026 你的名字</p>
        </footer>
    </main>
</body>
</html>

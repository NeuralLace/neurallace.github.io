<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人导航页面 - 链接索引">
    <title>我的个人导航</title>

    <!-- Font Awesome 6 图标库 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==================== CSS 变量：修改配色从这里入手 ==================== */
        :root {
            /* 背景渐变 */
            --bg-gradient-start: #f0f2f5;
            --bg-gradient-end: #e8ecf1;

            /* 卡片颜色 */
            --card-bg: #ffffff;
            --card-bg-hover: #fafbfc;

            /* 强调色（用于图标背景、链接高亮等） */
            --accent: #5b6af0;
            --accent-light: #eef0ff;
            --accent-hover: #4a56d4;

            /* 文字颜色 */
            --text-primary: #1a1a2e;
            --text-secondary: #5a6070;
            --text-muted: #9499a5;

            /* 边框与阴影 */
            --card-border: #e8eaef;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
            --card-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);

            /* 圆角 */
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;

            /* 间距 */
            --spacing-xs: 6px;
            --spacing-sm: 12px;
            --spacing-md: 20px;
            --spacing-lg: 28px;
            --spacing-xl: 40px;

            /* 过渡 */
            --transition-fast: 0.18s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==================== 全局重置 ==================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial,
                sans-serif;
            background: linear-gradient(170deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: var(--spacing-lg);
            color: var(--text-primary);
            line-height: 1.6;
            /* 背景光斑装饰 */
            position: relative;
            overflow-x: hidden;
        }

        /* ---- 背景光斑装饰 ---- */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: floatBlob 20s ease-in-out infinite;
        }
        body::before {
            width: 420px;
            height: 420px;
            background: #d5d9ff;
            top: -120px;
            left: -100px;
        }
        body::after {
            width: 350px;
            height: 350px;
            background: #e0e7ff;
            bottom: -100px;
            right: -80px;
            animation-delay: -10s;
        }

        @keyframes floatBlob {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(40px, -30px) scale(1.06);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.94);
            }
            75% {
                transform: translate(-35px, -15px) scale(1.04);
            }
        }

        /* ==================== 主容器 ==================== */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
            padding: var(--spacing-xl) var(--spacing-lg);
            margin-top: 20px;
            margin-bottom: 40px;
            animation: fadeInUp 0.7s ease both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== 个人信息区 ==================== */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        /* 头像容器 */
        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: var(--spacing-md);
            flex-shrink: 0;
        }
        .avatar-wrapper::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    var(--accent),
                    #a78bfa,
                    #f0abfc,
                    var(--accent));
            mask: radial-gradient(farthest-side, transparent 62%, #000 64%);
            -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 64%);
            animation: avatarGlow 4s linear infinite;
            pointer-events: none;
        }
        @keyframes avatarGlow {
            to {
                transform: rotate(360deg);
            }
        }

        /* 头像图片（请替换为您的头像URL） */
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            background: #e8eaef;
            /* 默认占位背景色 */;
        }

        /* 如果没有头像图片，使用首字母占位 */
        .avatar-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.02em;
            position: relative;
            z-index: 1;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            user-select: none;
        }

        /* 姓名 */
        .profile-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
            letter-spacing: 0.01em;
        }

        /* 一句话介绍 */
        .profile-bio {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
            max-width: 380px;
            line-height: 1.5;
        }

        /* 标签组 */
        .tags-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
        }
        .tag {
            display: inline-block;
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--accent);
            background: var(--accent-light);
            border-radius: var(--radius-full);
            letter-spacing: 0.02em;
            white-space: nowrap;
            transition: background var(--transition-fast), color var(--transition-fast);
        }
        .tag:hover {
            background: var(--accent);
            color: #fff;
        }

        /* 社交媒体图标行 */
        .social-links {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            justify-content: center;
        }
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #f5f6f9;
            color: var(--text-secondary);
            font-size: 1.15rem;
            text-decoration: none;
            transition: all var(--transition-smooth);
            position: relative;
        }
        .social-link:hover {
            background: var(--accent);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(91, 106, 240, 0.3);
        }
        .social-link:active {
            transform: translateY(-1px) scale(0.96);
        }

        /* ==================== 链接分类区 ==================== */
        .links-sections {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        /* 单个分类区块 */
        .link-category {
            /* 可在此添加分类级样式 */;
        }

        .category-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
            padding-left: 4px;
        }

        /* 链接卡片网格 */
        .link-cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 单张链接卡片 */
        .link-card {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: 14px 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--text-primary);
            transition: all var(--transition-smooth);
            cursor: pointer;
            position: relative;
            box-shadow: var(--card-shadow);
            /* 初始状态 */;
        }
        .link-card:hover {
            background: var(--card-bg-hover);
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-2px);
            border-color: #d5d8e8;
        }
        .link-card:active {
            transform: translateY(0) scale(0.985);
            transition: all 0.1s ease;
        }

        /* 卡片中的图标圆形容器 */
        .link-card-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            transition: transform var(--transition-fast);
        }
        .link-card:hover .link-card-icon {
            transform: scale(1.08);
        }

        /* 不同分类的图标配色（可自定义） */
        .icon-social {
            background: #eef2ff;
            color: #5b6af0;
        }
        .icon-project {
            background: #fdf2f8;
            color: #db2777;
        }
        .icon-tool {
            background: #ecfdf5;
            color: #059669;
        }
        .icon-other {
            background: #fff7ed;
            color: #ea580c;
        }

        /* 卡片文字区域 */
        .link-card-text {
            flex: 1;
            min-width: 0;
        }
        .link-card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.01em;
            line-height: 1.3;
        }
        .link-card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1px;
            line-height: 1.4;
            /* 单行溢出省略 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 卡片右侧箭头 */
        .link-card-arrow {
            color: #c5c9d4;
            font-size: 0.75rem;
            flex-shrink: 0;
            transition: all var(--transition-smooth);
        }
        .link-card:hover .link-card-arrow {
            color: var(--accent);
            transform: translateX(3px);
        }

        /* ==================== 页脚 ==================== */
        .footer {
            text-align: center;
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.03em;
        }
        .footer .heart {
            color: #ef4444;
            display: inline-block;
            animation: heartbeat 1.4s ease infinite;
        }
        @keyframes heartbeat {
            0%,
            100%,
            50% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.2);
            }
            75% {
                transform: scale(0.95);
            }
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 640px) {
            body {
                padding: var(--spacing-sm);
                align-items: flex-start;
            }
            .main-container {
                padding: var(--spacing-lg) var(--spacing-md);
                margin-top: 8px;
                margin-bottom: 20px;
                border-radius: var(--radius-md);
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            }
            .avatar-wrapper {
                width: 80px;
                height: 80px;
                margin-bottom: var(--spacing-sm);
            }
            .avatar-wrapper::after {
                inset: -4px;
            }
            .profile-name {
                font-size: 1.35rem;
            }
            .profile-bio {
                font-size: 0.85rem;
                max-width: 280px;
            }
            .link-card {
                padding: 12px 14px;
                gap: 10px;
                border-radius: var(--radius-sm);
            }
            .link-card-icon {
                width: 38px;
                height: 38px;
                font-size: 1rem;
                border-radius: 8px;
            }
            .link-card-title {
                font-size: 0.9rem;
            }
            .link-card-desc {
                font-size: 0.75rem;
            }
            .link-card-arrow {
                font-size: 0.7rem;
            }
            .social-link {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            .category-title {
                font-size: 0.78rem;
            }
            body::before {
                width: 250px;
                height: 250px;
                top: -80px;
                left: -60px;
            }
            body::after {
                width: 200px;
                height: 200px;
                bottom: -60px;
                right: -50px;
            }
        }

        @media (max-width: 380px) {
            .main-container {
                padding: 16px 12px;
            }
            .link-card {
                padding: 10px 12px;
                gap: 8px;
            }
            .link-card-icon {
                width: 34px;
                height: 34px;
                font-size: 0.9rem;
                border-radius: 7px;
            }
            .link-card-desc {
                display: none;
                /* 超小屏幕隐藏描述 */;
            }
            .profile-bio {
                font-size: 0.8rem;
                max-width: 240px;
            }
        }

        /* ==================== 打印样式 ==================== */
        @media print {
            body {
                background: #fff;
            }
            .main-container {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            body::before,
            body::after {
                display: none;
            }
        }

        /* ==================== 减少动画偏好 ==================== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
